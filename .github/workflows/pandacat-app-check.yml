name: Pandacat first Blog release staging
on:
  push:
    branches: [pandacat-app-check]
    paths: [.github/workflows/pandacat-app-check.yml]
permissions:
  contents: read
concurrency:
  group: pandacat-blog-first-release
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository_id == '1109968620' && github.actor == 'chenyuming616'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: pandacat-blog-first-release
      MAIN: 6d561133fffbc9049c78ad1786589d23aceda4af
      BOOTSTRAP: 02e96fb19e0f4a1e7b6d0007b0325589a63bfe08
      CI_BLOB: 26a5c93d8b3478a1bed35d785e0d8f72f4516ade
      EXPECTED_PATCH_SHA256: a6e2b5c216a1bb618f8969390cadc09cffea75ff5daa48af5629bd1d2fd4c888
      EXPECTED_TREE: c23afc9a50ad393bafe19bb5742aadaae0515c92
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release bytes and validate isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN"
          test "$(git rev-parse "refs/remotes/origin/$BRANCH")" = "$BOOTSTRAP"
          test "$(git rev-parse "$BOOTSTRAP^")" = "$MAIN"
          test "$(git diff-tree --no-commit-id --name-only -r "$BOOTSTRAP")" = '.github/workflows/blog.yml'
          test "$(git rev-parse "$BOOTSTRAP:.github/workflows/blog.yml")" = "$CI_BLOB"
          patch="$RUNNER_TEMP/pandacat-first-release.patch"
          git show "$GITHUB_SHA:pandacat-first-release.patch" > "$patch"
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" "$patch" | sha256sum --check --status
          git worktree add --detach "$RUNNER_TEMP/pandacat-release" "$BOOTSTRAP"
          cd "$RUNNER_TEMP/pandacat-release"
          git apply --check --index --exclude=.github/workflows/blog.yml "$patch"
          git apply --index --exclude=.github/workflows/blog.yml "$patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --quiet
          git diff --cached --check
          npm ci --ignore-scripts
          npm run lint
          npm run blog:check
          npm run blog:test
          npm run blog:stage
          git diff --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Mint narrowly scoped Pandacat App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liSwalpPizE6DPz0
          private-key: ${{ secrets.PANDACAT_APP_CHECK_KEY }}
          owner: chenyuming616
          repositories: pandacat-landing-page
          permission-contents: write
          permission-pull-requests: write
      - name: App stages exact candidate and opens draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          GH_REPO: chenyuming616/pandacat-landing-page
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test "$APP_SLUG" = 'pandacat-blog-publisher'
          test -n "$INSTALLATION_ID"
          gh api --paginate 'installation/repositories?per_page=100' | jq -es '[.[].repositories[].id] == [1109968620]' >/dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)" = "$BOOTSTRAP"
          test "$(gh api "repos/$GH_REPO/pulls?state=open&head=chenyuming616:$BRANCH&base=main" --jq length)" = 0
          cd "$RUNNER_TEMP/pandacat-release"
          test "$(git rev-parse HEAD)" = "$BOOTSTRAP"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          bot="$APP_SLUG[bot]"
          bot_id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          [[ "$bot_id" =~ ^[0-9]+$ ]]
          email="$bot_id+$bot@users.noreply.github.com"
          git -c user.name="$bot" -c user.email="$email" commit -m 'feat: publish first Pandacat Blog article'
          head="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test "$(git rev-parse 'HEAD^')" = "$BOOTSTRAP"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic" git push "https://github.com/$GH_REPO.git" "HEAD:refs/heads/$BRANCH"
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)" = "$head"
          number="$(gh api "repos/$GH_REPO/pulls" -f title='Publish first Pandacat Blog article' -f head="$BRANCH" -f base=main -F draft=true -f body='App-authenticated staging of the reviewed first Blog release. Verify Blog CI and Vercel preview before merge.' --jq .number)"
          gh api "repos/$GH_REPO/pulls/$number" | jq -e --arg actor "$bot" --arg head "$head" 'select(.draft and .user.login == $actor and .head.sha == $head and .base.ref == "main") | {url: .html_url, head: .head.sha, author: .user.login, draft}'
