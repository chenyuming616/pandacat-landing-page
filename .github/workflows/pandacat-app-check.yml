name: Pandacat App Cloud Check
on:
  push:
    branches: [pandacat-app-check]
    paths: [.github/workflows/pandacat-app-check.yml]

permissions: {}

jobs:
  app-check:
    if: github.repository == 'chenyuming616/pandacat-landing-page'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create read-only App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liSwalpPizE6DPz0
          private-key: ${{ secrets.PANDACAT_APP_CHECK_KEY }}
          owner: chenyuming616
          repositories: pandacat-landing-page
          permission-contents: read
      - name: Assert the token can see only Pandacat
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh api --hostname github.com --paginate 'installation/repositories?per_page=100' |
            jq -es '[.[].repositories[] | .id] == [1109968620]' >/dev/null
          echo 'PASS: GitHub App token scoped to Pandacat only'
