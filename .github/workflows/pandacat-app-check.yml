name: Pandacat first Blog release merge
on:
  push:
    branches: [pandacat-app-check]
    paths: [.github/workflows/pandacat-app-check.yml]
permissions: {}
concurrency:
  group: pandacat-blog-first-release
  cancel-in-progress: false
jobs:
  merge:
    if: github.repository_id == '1109968620' && github.actor == 'chenyuming616'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: chenyuming616/pandacat-landing-page
      NUMBER: '2'
      HEAD: 9c6bc17a856a6d3cbdbec707daf86211055ce4d6
      MAIN: 6d561133fffbc9049c78ad1786589d23aceda4af
      TREE: c23afc9a50ad393bafe19bb5742aadaae0515c92
      BRANCH: pandacat-blog-first-release
    steps:
      - name: Mint repository-scoped Pandacat App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: Iv23liSwalpPizE6DPz0
          private-key: ${{ secrets.PANDACAT_APP_CHECK_KEY }}
          owner: chenyuming616
          repositories: pandacat-landing-page
          permission-contents: write
          permission-pull-requests: write
      - name: Verify reviewed release, mark ready, and merge exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ && "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$APP_SLUG" = 'pandacat-blog-publisher'
          gh api --paginate 'installation/repositories?per_page=100' | jq -es '[.[].repositories[].id] == [1109968620]' >/dev/null
          repo="repos/$GH_REPO"
          test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
          test "$(gh api "$repo/git/ref/heads/$BRANCH" --jq .object.sha)" = "$HEAD"
          test "$(gh api "$repo/git/commits/$HEAD" --jq .tree.sha)" = "$TREE"
          read_pr() {
            gh api "$repo/pulls/$NUMBER" | jq -er --argjson draft "$1" --arg head "$HEAD" --arg main "$MAIN" --arg branch "$BRANCH" --arg author "$APP_SLUG[bot]" --arg repo "$GH_REPO" 'select(.draft == $draft and .state == "open" and .merged == false and .user.login == $author and .head.ref == $branch and .head.sha == $head and .head.repo.full_name == $repo and .base.ref == "main" and .base.sha == $main and .base.repo.full_name == $repo) | .node_id | strings | select(length > 0)'
          }
          pr_id="$(read_pr true)"
          curl --disable --fail --silent --show-error --max-time 15 "https://api.github.com/$repo/actions/workflows/blog.yml/runs?event=pull_request&head_sha=$HEAD&per_page=20" | jq -e --arg head "$HEAD" --argjson number "$NUMBER" '[.workflow_runs[] | select(.head_sha == $head and any(.pull_requests[]; .number == $number))] | sort_by(.run_number, .run_attempt) | last | .status == "completed" and .conclusion == "success"' >/dev/null
          gh api "$repo/commits/$HEAD/status" | jq -e 'any(.statuses[]; .context == "Vercel" and .state == "success" and (.target_url | startswith("https://vercel.com/lias-projects-0cb21a17/pandacat-landing-page/")))' >/dev/null
          gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{id isDraft}}}' -f id="$pr_id" | jq -e --arg id "$pr_id" 'select(.errors == null) | .data.markPullRequestReadyForReview.pullRequest | .id == $id and .isDraft == false' >/dev/null
          test "$(read_pr false)" = "$pr_id"
          test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$MAIN"
          merge_sha="$(gh api --method PUT "$repo/pulls/$NUMBER/merge" -f sha="$HEAD" -f merge_method=merge | jq -er 'select(.merged == true) | .sha')"
          gh api "$repo/git/commits/$merge_sha" | jq -e --arg sha "$merge_sha" --arg head "$HEAD" --arg main "$MAIN" --arg tree "$TREE" 'select(.sha == $sha and .tree.sha == $tree and ([.parents[].sha] == [$main, $head])) | {sha, tree: .tree.sha}'
          test "$(gh api "$repo/git/ref/heads/main" --jq .object.sha)" = "$merge_sha"
